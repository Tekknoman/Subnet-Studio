name: Deploy dev and production to Pages

on:
  push:
    branches: [dev]
  pull_request:
    branches: [prod]
    types: [closed]
  workflow_dispatch:

# Both URLs belong to a single Pages site. Never publish partial artifacts.
# Every run resolves the latest eligible refs, including when a queued run replaces another.
concurrency:
  group: subnet-studio-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve development and latest merged production release
        id: refs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const dev = await github.rest.git.getRef({ owner, repo, ref: 'heads/dev' });
            core.setOutput('dev', dev.data.object.sha);
            // Direct prod commits must not become releases, even during a dev deployment.
            // Resolve merged PRs, not the current prod branch head. Squash and rebase merges work too.
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', base: 'prod', per_page: 100
            });
            const release = pulls.filter(p => p.merged_at && p.merge_commit_sha)
              .sort((a, b) => Date.parse(b.merged_at) - Date.parse(a.merged_at) || b.number - a.number)[0];
            core.setOutput('prod', release?.merge_commit_sha || '');
            core.setOutput('pr', release?.number || '');
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.dev }}
          path: development
          persist-credentials: false
      - name: Check out released production
        if: steps.refs.outputs.prod != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.prod }}
          path: production
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test development
        working-directory: development
        run: npm test
      - name: Test production
        if: steps.refs.outputs.prod != ''
        working-directory: production
        run: npm test
      - name: Assemble both environments
        env:
          PROD_SHA: ${{ steps.refs.outputs.prod }}
          DEV_SHA: ${{ steps.refs.outputs.dev }}
          PROD_PR: ${{ steps.refs.outputs.pr }}
        run: node development/scripts/assemble-pages.mjs
      - name: Upload the complete Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy both URLs atomically
        id: deployment
        uses: actions/deploy-pages@v4
