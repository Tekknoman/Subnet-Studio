name: Deploy all environments to Pages

on:
  push:
    branches: [dev, 'feat/**']
  pull_request:
    branches: [prod]
    types: [closed]
  delete:
  workflow_dispatch:

# Both URLs belong to a single Pages site. Never publish partial artifacts.
# Every run resolves the latest eligible refs, including when a queued run replaces another.
concurrency:
  group: subnet-studio-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out publishing tools and all branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve latest eligible versions
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const dev = await github.rest.git.getRef({owner, repo, ref:'heads/dev'});
            const pulls = await github.paginate(github.rest.pulls.list, {owner,repo,state:'closed',base:'prod',per_page:100});
            const release = pulls.filter(p=>p.merged_at && p.merge_commit_sha)
              .sort((a,b)=>Date.parse(b.merged_at)-Date.parse(a.merged_at)||b.number-a.number)[0];
            const branches = await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            const refs = {dev:dev.data.object.sha,prod:release?.merge_commit_sha||'',pr:release?.number||'',
              features:branches.filter(b=>b.name.startsWith('feat/')).map(b=>({branch:b.name,sha:b.commit.sha}))};
            require('fs').writeFileSync('refs.json',JSON.stringify(refs));
      - name: Test and assemble dev, production and every feature preview
        run: |
          git fetch origin
          node scripts/publish-all.mjs
      - name: Upload the complete Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy both URLs atomically
        id: deployment
        uses: actions/deploy-pages@v4
